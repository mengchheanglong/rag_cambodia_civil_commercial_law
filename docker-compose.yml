version: "3.9"

services:
  # ── FastAPI REST API ────────────────────────────────────────────────────────
  api:
    build: .
    command: uvicorn src.interfaces.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # persist indices and chunks
      - ./src:/app/src            # hot-reload during development
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Streamlit Web UI ────────────────────────────────────────────────────────
  ui:
    build: .
    command: >
      streamlit run src/interfaces/ui/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      - api
    restart: unless-stopped

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cambodia_law
      POSTGRES_USER: law_user
      POSTGRES_PASSWORD: law_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law_user -d cambodia_law"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
